<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120b07">
<title>مِرباع | MIRBAA Majlis</title>
<style>
:root{--gold:#e7b85c;--gold2:#ffe0a0;--cream:#fff7e7;--red:#c9232e;--felt:#07533c;--dark:#090705}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050403;color:#fff7e8;font-family:Tahoma,Arial,sans-serif}
body{overflow:hidden;background:radial-gradient(circle at 50% -15%,#5a3820,#130d08 42%,#050403 78%)}
.app{width:min(100%,560px);height:100svh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#211408,#090604)}
/* room */
.room{position:absolute;inset:0;background:
linear-gradient(#0000 0 70%,#0007),
radial-gradient(ellipse at 50% 18%,#7c512a55,transparent 42%),
repeating-linear-gradient(90deg,#2b170d 0 24px,#351d10 24px 48px)}
.walltrim{position:absolute;left:0;right:0;top:86px;height:8px;background:linear-gradient(90deg,#6c3f20,#d2944f,#5d3219);box-shadow:0 5px 18px #000}
.carpet{position:absolute;left:-15%;right:-15%;bottom:-8%;height:46%;transform:perspective(500px) rotateX(57deg);transform-origin:bottom;background:
radial-gradient(circle at center,#7d2024 0 3%,transparent 3.4%),
repeating-radial-gradient(circle at center,#8e2728 0 10px,#65191d 11px 21px,#b27a39 22px 24px);opacity:.78}
.cushion{position:absolute;top:130px;width:92px;height:240px;border-radius:25px;background:linear-gradient(90deg,#4c1b18,#872c25,#4c1b18);border:3px solid #b78243;box-shadow:0 14px 35px #000a,inset 0 0 25px #0007}.c1{left:-42px;transform:rotate(5deg)}.c2{right:-42px;transform:rotate(-5deg)}
/* header */
.top{position:absolute;z-index:60;top:0;left:0;right:0;height:88px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#080604dd,#08060466,transparent)}
.brand{display:flex;gap:9px;align-items:center}.mark{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#f4ca70,#9e611b);display:grid;place-items:center;color:#171006;font-size:25px;box-shadow:0 5px 18px #000b}.brand b{display:block;font-size:26px;color:#f4cc78;line-height:1}.brand small{font-size:9px;letter-spacing:4px;color:#c4ae86}
.headBtns{display:flex;gap:7px}.headBtns button{width:40px;height:40px;border-radius:13px;border:1px solid #ffffff17;background:#0d0d0cdd;color:#eee0c7;font-size:17px}
/* table perspective */
.tableWrap{position:absolute;z-index:10;left:50%;top:51%;width:92%;height:67%;transform:translate(-50%,-50%);filter:drop-shadow(0 25px 32px #000c)}
.outer{position:absolute;inset:0;border-radius:46% / 17%;background:linear-gradient(145deg,#a66a39 0,#4b2916 36%,#c08347 64%,#3b1f11);padding:13px;box-shadow:inset 0 3px #f3c88a55,inset 0 -8px 18px #1d0d07}
.inner{height:100%;position:relative;overflow:hidden;border-radius:45% / 16%;border:5px solid #2c190f;background:
radial-gradient(ellipse at 50% 42%,#0c7c59,#07543d 55%,#03382a);box-shadow:inset 0 0 75px #001b13,inset 0 0 0 2px #ffffff08}
.inner:after{content:"";position:absolute;inset:0;opacity:.11;background-image:radial-gradient(#fff .6px,transparent .8px);background-size:6px 6px}
.logoWater{position:absolute;z-index:1;top:44%;width:100%;text-align:center;font-size:54px;font-weight:bold;color:#ffffff08;transform:rotate(-9deg)}
/* HUD */
.hud{position:absolute;z-index:40;top:11px;left:9%;right:9%;display:flex;align-items:flex-start;justify-content:space-between}.score{display:flex;direction:ltr;gap:5px}.score div{min-width:57px;padding:5px;border-radius:14px;background:#061812e8;border:1px solid #ffffff13;text-align:center}.score small{display:block;font-size:9px;color:#c7b99f}.score strong{font-size:21px}.status{padding:7px 10px;border-radius:14px;background:#061812e8;border:1px solid #ffffff13;text-align:right;font-size:9px;line-height:1.55}.status b{color:var(--gold2)}
/* seats */
.seat{position:absolute;z-index:35;width:90px;text-align:center}.avatar{width:62px;height:62px;margin:auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#725139,#1b120c 63%);border:3px solid #b27d40;box-shadow:0 7px 18px #000c;font-weight:bold;font-size:18px;position:relative}.lvl{position:absolute;bottom:-3px;right:-3px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#12100d;border:1px solid #e5b65b;font-size:9px}.seat.active .avatar{border-color:#ffe19b;box-shadow:0 0 0 5px #f4c86120,0 0 30px #ffc75f99,0 7px 18px #000c}.name{margin-top:3px;font-size:12px;text-shadow:0 2px 4px #000}.tag{font-size:9px;color:#c4b79f}.north{top:44px;left:50%;transform:translateX(-50%)}.east{right:2px;top:42%;transform:translateY(-50%)}.west{left:2px;top:42%;transform:translateY(-50%)}.south{bottom:0;left:50%;transform:translateX(-50%)}
.backs{display:flex;direction:ltr;justify-content:center;margin-top:4px}.backs i{width:14px;height:30px;margin-left:-7px;border-radius:4px;border:1px solid #e6bd6d;background:repeating-linear-gradient(135deg,#8a1d23 0 4px,#d5a049 4px 7px);box-shadow:0 2px 5px #0009}
/* stage */
.stage{position:absolute;z-index:25;left:50%;top:43%;transform:translate(-50%,-50%);width:62%;height:245px}.turn{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;background:#051711e8;border:1px solid #ffffff14;padding:7px 12px;border-radius:14px;font-size:10px;box-shadow:0 5px 15px #0008}
.market,.played{background:linear-gradient(145deg,#fffef9,#eee3cf);border:1px solid #d4c5a8;color:#17110d;box-shadow:0 8px 18px #000a;font-weight:bold}.market{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:65px;height:94px;border-radius:10px;display:grid;place-items:center;font-size:21px}.played{position:absolute;width:56px;height:82px;border-radius:9px;display:grid;place-items:center;font-size:18px;animation:throw .22s cubic-bezier(.2,.8,.2,1)}@keyframes throw{from{opacity:.1;scale:.65}to{opacity:1;scale:1}}
.p0{left:50%;bottom:0;transform:translateX(-50%)}.p1{right:0;top:52%;transform:translateY(-50%) rotate(-7deg)}.p2{left:50%;top:31px;transform:translateX(-50%)}.p3{left:0;top:52%;transform:translateY(-50%) rotate(7deg)}.red{color:#bb2130!important}
/* controls */
.bid{position:absolute;z-index:45;left:50%;top:59%;transform:translateX(-50%);display:flex;direction:rtl;gap:6px}.bid button{min-width:68px;padding:12px 11px;border-radius:14px;border:1px solid #ffffff10;background:#091914;color:#fff;font:14px Tahoma;box-shadow:0 5px 14px #0009}.bid .gold{background:linear-gradient(#edbe62,#ae6d20);color:#171006}.bid .cream{background:#f5eddd;color:#17120d}
.hand{position:absolute;z-index:50;left:50%;bottom:64px;transform:translateX(-50%);width:96%;height:124px;display:flex;direction:ltr;justify-content:center;align-items:flex-end;pointer-events:none}.card{pointer-events:auto;width:61px;height:98px;margin-left:-9px;border:1px solid #d6c7aa;border-radius:10px;background:linear-gradient(145deg,#fffef9,#ede2cd);color:#17110d;box-shadow:0 8px 15px #000a;font:bold 19px Tahoma;transition:.17s}.card:nth-child(1){transform:rotate(-10deg) translateY(10px)}.card:nth-child(2){transform:rotate(-7deg) translateY(6px)}.card:nth-child(3){transform:rotate(-4deg) translateY(2px)}.card:nth-child(4){transform:rotate(-1deg)}.card:nth-child(5){transform:rotate(2deg)}.card:nth-child(6){transform:rotate(5deg) translateY(2px)}.card:nth-child(7){transform:rotate(8deg) translateY(6px)}.card:nth-child(8){transform:rotate(11deg) translateY(10px)}.card:active{transform:translateY(-20px)!important;z-index:80}.card.disabled{opacity:.36;filter:grayscale(.6)}
.qaid{position:absolute;z-index:65;right:12px;bottom:11px;width:72px;height:54px;border-radius:18px;border:1px solid #ff8b8b44;background:linear-gradient(#d22b35,#a8171e);color:white;font:15px Tahoma;box-shadow:0 8px 20px #000a}.toast{position:absolute;z-index:65;left:12px;bottom:11px;max-width:220px;padding:8px 11px;border-radius:14px;background:#051711e8;border:1px solid #ffffff13;font-size:10px;line-height:1.5;box-shadow:0 6px 16px #0008}
/* bottom sheet */
.sheet{display:none;position:absolute;z-index:100;inset:0;background:#000a;align-items:flex-end}.sheet.show{display:flex}.panel{width:100%;padding:18px 15px calc(18px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:linear-gradient(#1a1510,#090806);border-top:1px solid #ffffff18}.panel h2{margin:0;color:#f3ca75}.panel p{margin:5px 0 15px;color:#b9aa90;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button,.close{padding:13px;border-radius:13px;font:13px Tahoma}.grid button{background:#111612;border:1px solid #ffffff12;color:#eee}.close{width:100%;margin-top:9px;border:0;background:linear-gradient(#e5b65c,#a96a1d);font-weight:bold;color:#171006}
@media(max-width:390px){.tableWrap{width:95%}.card{width:55px;height:92px}.stage{width:67%}}
</style></head>
<body><div class="app"><div class="room"><div class="walltrim"></div><div class="carpet"></div><div class="cushion c1"></div><div class="cushion c2"></div></div>
<header class="top"><div class="brand"><div class="mark">♠</div><div><b>مِرباع</b><small>MIRBAA</small></div></div><div class="headBtns"><button onclick="toggleSheet()">☰</button><button onclick="toast('الصوت مفعّل')">♪</button></div></header>
<div class="tableWrap"><div class="outer"><div class="inner"><div class="logoWater">مِرباع</div>
<div class="hud"><div class="score"><div><small>لنا</small><strong>0</strong></div><div><small>لهم</small><strong>0</strong></div></div><div class="status"><b id="contractText">السوق</b><br><span id="roundText">الصكة 1 • الأكلة 1/8</span></div></div>
<div class="seat north" id="seat2"><div class="avatar">ن<span class="lvl">12</span></div><div class="name">ناصر</div><div class="tag">شريكك</div><div class="backs" id="b2"></div></div>
<div class="seat east" id="seat1"><div class="avatar">ف<span class="lvl">12</span></div><div class="name">فهد</div><div class="backs" id="b1"></div></div>
<div class="seat west" id="seat3"><div class="avatar">س<span class="lvl">11</span></div><div class="name">سالم</div><div class="backs" id="b3"></div></div>
<div class="stage"><div class="turn" id="turnText"></div><div class="market" id="market"></div><div id="trick"></div></div>
<div class="bid" id="bid"><button class="gold" onclick="buy('حكم')">حكم</button><button class="cream" onclick="buy('صن')">صن</button><button onclick="buy('بس')">بس</button></div>
<div class="hand" id="hand"></div>
<div class="seat south active" id="seat0"><div class="avatar">أنت<span class="lvl">13</span></div><div class="name">محمد</div><div class="tag">أنت</div></div>
<button class="qaid" onclick="toast('⚠ تم تسجيل طلب قيد')">⚠ قيد</button><div class="toast" id="toast">MIRBAA Majlis • واجهة لعب جديدة</div>
</div></div></div>
<div class="sheet" id="sheet"><div class="panel"><h2>مِرباع</h2><p>خيارات المجلس</p><div class="grid"><button>الإعدادات</button><button>سجل اللعب</button><button>اللاعبون</button><button>مغادرة المجلس</button></div><button class="close" onclick="toggleSheet()">العودة للمجلس</button></div></div>
</div>
<script>
const S=['♠','♥','♦','♣'],R=['7','8','9','10','J','Q','K','A'],N=['محمد','فهد','ناصر','سالم'];
let deck=[],hands=[[],[],[],[]],turn=0,phase='buy',marketCard=null,contract='',trump=null,trick=[],trickNo=1;
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function setup(){let id=0;deck=[];hands=[[],[],[],[]];for(const s of S)for(const r of R)deck.push({id:'c'+(++id),s,r});shuffle(deck);for(let n=0;n<5;n++)for(let p=0;p<4;p++)hands[p].push(deck.pop());marketCard=deck.pop();render()}
const isRed=c=>c.s==='♥'||c.s==='♦';
function legal(p){if(!trick.length)return hands[p].slice();const lead=trick[0].c.s,same=hands[p].filter(c=>c.s===lead);return same.length?same:hands[p].slice()}
function render(){
 for(let p=1;p<4;p++)document.getElementById('b'+p).innerHTML=hands[p].map(()=>'<i></i>').join('');
 const allowed=new Set(legal(0).map(c=>c.id));
 document.getElementById('hand').innerHTML=hands[0].map(c=>`<button class="card ${isRed(c)?'red':''} ${phase==='play'&&turn===0&&!allowed.has(c.id)?'disabled':''}" onclick="play('${c.id}')">${c.s}<br>${c.r}</button>`).join('');
 const m=document.getElementById('market');m.style.display=phase==='buy'?'grid':'none';m.innerHTML=marketCard?`<span class="${isRed(marketCard)?'red':''}">${marketCard.s}<br>${marketCard.r}</span>`:'';
 document.getElementById('bid').style.display=phase==='buy'&&turn===0?'flex':'none';
 document.getElementById('contractText').textContent=phase==='buy'?'السوق':contract+(trump?' '+trump:'');
 document.getElementById('roundText').textContent=`الصكة 1 • الأكلة ${trickNo}/8`;
 document.getElementById('turnText').textContent=phase==='buy'?`الشراء • دور ${N[turn]}`:`${contract}${trump?' '+trump:''} • دور ${N[turn]}`;
 for(let p=0;p<4;p++)document.getElementById('seat'+p).classList.toggle('active',p===turn);
 document.getElementById('trick').innerHTML=trick.map(x=>`<div class="played p${x.p} ${isRed(x.c)?'red':''}">${x.c.s}<br>${x.c.r}</div>`).join('')
}
function toast(t){document.getElementById('toast').textContent=t}
function next(){turn=(turn+1)%4;render()}
function buy(x){if(phase!=='buy'||turn!==0)return;if(x==='بس'){toast('محمد: بس');next();return setTimeout(botBuy,400)}contract=x;trump=x==='حكم'?marketCard.s:null;phase='play';hands[0].push(marketCard);marketCard=null;for(let p=0;p<4;p++)while(hands[p].length<8&&deck.length)hands[p].push(deck.pop());turn=0;toast('تم الشراء • '+contract+(trump?' '+trump:''));render()}
function botBuy(){if(phase!=='buy'||turn===0)return;toast(N[turn]+': بس');next();if(turn!==0)setTimeout(botBuy,400)}
function play(id){if(phase!=='play'||turn!==0)return;const a=legal(0);if(!a.some(c=>c.id===id)){toast('لا يمكن: معك ورقة من نفس النوع');return}const i=hands[0].findIndex(c=>c.id===id),c=hands[0].splice(i,1)[0];trick.push({p:0,c});next();setTimeout(botPlay,360)}
function botPlay(){if(phase!=='play'||turn===0)return;const p=turn,a=legal(p),c=a[Math.floor(Math.random()*a.length)],i=hands[p].findIndex(x=>x.id===c.id);hands[p].splice(i,1);trick.push({p,c});next();if(trick.length===4)setTimeout(()=>{trick=[];trickNo=Math.min(8,trickNo+1);turn=0;toast('انتهت الأكلة • واجهة المجلس تعمل');render()},600);else if(turn!==0)setTimeout(botPlay,360)}
function toggleSheet(){document.getElementById('sheet').classList.toggle('show')}setup();
</script></body></html>
