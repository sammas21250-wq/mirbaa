<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRBAA Alpha</title><style>
:root{--bg:#101713;--felt:#173f2b;--gold:#d7ad58;--card:#fffaf0;--ink:#161616;--muted:#b9c5bd}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at top,#24392d,#0c110e 65%);color:#fff;min-height:100vh}.app{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900;color:var(--gold)}.score{display:flex;gap:8px}.pill{background:#ffffff12;border:1px solid #ffffff22;padding:8px 12px;border-radius:999px}.table{position:relative;height:560px;margin-top:12px;border:2px solid #ffffff1c;border-radius:34px;background:radial-gradient(circle,#246541,var(--felt) 62%,#0d291c);box-shadow:inset 0 0 50px #0006,0 20px 50px #0005;overflow:hidden}.seat{position:absolute;text-align:center;font-size:12px;color:#e7eee9}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#0e1c15;border:2px solid #ffffff35;margin:auto;font-weight:800}.north{top:12px;left:50%;transform:translateX(-50%)}.east{right:10px;top:46%}.west{left:10px;top:46%}.south{bottom:10px;left:50%;transform:translateX(-50%)}.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:72%;text-align:center}.status{background:#0b1a12cc;border:1px solid #ffffff1c;border-radius:16px;padding:10px;margin-bottom:10px}.trick{height:150px;position:relative}.played{position:absolute;width:56px;height:78px;background:var(--card);color:var(--ink);border-radius:9px;display:grid;place-items:center;font-weight:900;box-shadow:0 4px 12px #0006}.p0{bottom:0;left:50%;transform:translateX(-50%)}.p1{right:8%;top:36px}.p2{top:0;left:50%;transform:translateX(-50%)}.p3{left:8%;top:36px}.red{color:#b3202a}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;background:#f3ead6;color:#1b211d}.btn.gold{background:var(--gold)}.btn.qayd{background:#a82828;color:white}.btn:disabled{opacity:.35}.hand{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);display:flex;direction:ltr;justify-content:center;width:90%}.card{width:54px;height:82px;margin-left:-9px;border-radius:9px;background:var(--card);color:var(--ink);border:1px solid #c8bfae;font-size:18px;font-weight:900;box-shadow:0 4px 10px #0005;transition:.15s}.card:hover,.card:focus{transform:translateY(-8px)}.card.red{color:#b3202a}.card:disabled{opacity:.45}.log{margin-top:12px;background:#ffffff0b;border:1px solid #ffffff16;border-radius:16px;padding:12px;color:var(--muted);font-size:13px}.tag{font-size:11px;color:#fff;background:#ffffff16;padding:5px 8px;border-radius:999px}.footer{text-align:center;color:#7f9186;font-size:11px;margin-top:10px}@media(max-width:500px){.table{height:590px}.center{width:76%}.card{width:49px;height:76px;font-size:16px}.hand{width:96%}}
</style></head><body><main class="app"><div class="top"><div><div class="logo">مِرباع <span style="font-size:12px;color:#fff">MIRBAA</span></div><span class="tag">Alpha 0.1 • تجربة محلية</span></div><div class="score"><span class="pill">لنا <b id="us">0</b></span><span class="pill">لهم <b id="them">0</b></span></div></div><section class="table"><div class="seat north"><div class="avatar">ن</div>ناصر</div><div class="seat east"><div class="avatar">ف</div>فهد</div><div class="seat west"><div class="avatar">س</div>سالم</div><div class="seat south"><div class="avatar">أنت</div></div><div class="center"><div class="status" id="status">ابدأ صكة جديدة</div><div class="controls" id="buy" style="display:none"><button class="btn gold" onclick="chooseMode('hokum')">حكم</button><button class="btn" onclick="chooseMode('sun')">صن</button></div><div class="trick" id="trick"></div><div class="controls"><button class="btn" id="new" onclick="newRound()">صكة جديدة</button><button class="btn qayd" id="qayd" onclick="qayd()" disabled>⚠️ قيد!</button></div></div><div class="hand" id="hand"></div></section><div class="log" id="log">هذه نسخة اختبار أولية تعمل بالكامل داخل المتصفح ضد 3 لاعبين آليين. الهدف الآن اختبار دورة اللعب والواجهة قبل الأونلاين.</div><div class="footer">MIRBAA • Prototype — لا توجد مراهنات أو أموال حقيقية</div></main><script>
const suits=['♠','♥','♦','♣'],ranks=['7','8','9','J','Q','K','10','A'];let hands=[],turn=0,mode=null,trump=null,trick=[],leader=0,roundOver=false,scores=[0,0];const $=id=>document.getElementById(id);function deck(){let d=[];for(const s of suits)for(const r of ranks)d.push({s,r,id:s+r});return d.sort(()=>Math.random()-.5)}function renderCard(c,i){let red=(c.s==='♥'||c.s==='♦')?' red':'';return `<button class="card${red}" onclick="playHuman(${i})">${c.s}<br>${c.r}</button>`}function newRound(){let d=deck();hands=[[],[],[],[]];for(let i=0;i<32;i++)hands[i%4].push(d[i]);turn=0;leader=0;trick=[];mode=null;trump=null;roundOver=false;$('buy').style.display='flex';$('new').disabled=true;$('qayd').disabled=true;$('status').textContent='اختر نوع اللعب: صن أو حكم';$('hand').innerHTML=hands[0].slice(0,5).map(renderCard).join('');$('trick').innerHTML='';log('تم توزيع 8 أوراق لكل لاعب. اختر صن أو حكم.');}function chooseMode(m){mode=m;if(m==='hokum'){trump=hands[0][0].s;log('اخترت حكم '+trump+' (في هذه النسخة التجريبية نوع الحكم يؤخذ من أول ورقة بيدك).')}else log('اخترت صن.');$('buy').style.display='none';$('new').disabled=true;turn=0;renderHand();$('status').textContent='دورك — العب ورقة';}function rankVal(c){if(mode==='hokum'&&c.s===trump){return {'J':20,'9':14,'A':11,'10':10,'K':4,'Q':3,'8':0,'7':0}[c.r]+50}return {'A':11,'10':10,'K':4,'Q':3,'J':2,'9':0,'8':0,'7':0}[c.r]}function legal(p,c){if(!trick.length)return true;let lead=trick[0].card.s;if(c.s===lead)return true;return !hands[p].some(x=>x.s===lead)}function renderHand(){ $('hand').innerHTML=hands[0].map((c,i)=>{let red=(c.s==='♥'||c.s==='♦')?' red':'';let dis=(turn!==0||!legal(0,c))?'disabled':'';return `<button class="card${red}" ${dis} onclick="playHuman(${i})">${c.s}<br>${c.r}</button>`}).join('')}function playHuman(i){if(turn!==0||roundOver)return;let c=hands[0][i];if(!legal(0,c))return log('لازم تمشي على النوع الموجود إذا كان عندك منه.');hands[0].splice(i,1);play(0,c);renderHand()}function play(p,c){trick.push({p,card:c});renderTrick();if(trick.length===4){setTimeout(resolveTrick,650);return}turn=(p+1)%4;if(turn===0){$('status').textContent='دورك';renderHand()}else setTimeout(botPlay,450)}function botPlay(){if(turn===0||roundOver)return;let p=turn,legalCards=hands[p].filter(c=>legal(p,c));let c=legalCards[Math.floor(Math.random()*legalCards.length)],i=hands[p].findIndex(x=>x.id===c.id);hands[p].splice(i,1);play(p,c)}function renderTrick(){$('trick').innerHTML=trick.map(x=>{let red=(x.card.s==='♥'||x.card.s==='♦')?' red':'';return `<div class="played p${x.p}${red}">${x.card.s}<br>${x.card.r}</div>`}).join('')}function winner(){let lead=trick[0].card.s,best=trick[0];for(const x of trick.slice(1)){let bt=best.card,ct=x.card;if(mode==='hokum'&&ct.s===trump&&bt.s!==trump){best=x;continue}if(mode==='hokum'&&bt.s===trump&&ct.s!==trump)continue;if(ct.s===bt.s&&rankVal(ct)>rankVal(bt))best=x;else if(bt.s!==trump&&ct.s===lead&&bt.s!==lead)best=x}return best.p}function resolveTrick(){let w=winner(),names=['أنت','فهد','ناصر','سالم'];log('الأكلة لـ '+names[w]);leader=w;turn=w;trick=[];$('trick').innerHTML='';if(hands.every(h=>h.length===0)){finishRound();return}if(turn===0){$('status').textContent='الأكلة لك — ابدأ';renderHand()}else{$('status').textContent='دور '+names[turn];setTimeout(botPlay,500)}}function finishRound(){roundOver=true;let add=Math.floor(Math.random()*18)+8;scores[Math.random()>.5?0:1]+=add;$('us').textContent=scores[0];$('them').textContent=scores[1];$('status').textContent='انتهت الصكة — النتيجة التجريبية حُدّثت';$('new').disabled=false;$('qayd').disabled=false;log('انتهت الصكة. الحساب الكامل والمشاريع والقيد التفصيلي ستدخل في النسخة التالية من المحرك.');if(scores[0]>=152||scores[1]>=152){alert((scores[0]>=152?'لنا':'لهم')+' فازوا بالمباراة!');scores=[0,0];$('us').textContent=0;$('them').textContent=0}}function qayd(){log('تم تسجيل طلب قيد. في Alpha الحالية الزر تجريبي؛ محرك مراجعة المخالفات الكامل قيد الدمج.');$('qayd').disabled=true}function log(t){$('log').textContent=t}newRound();
</script></body></html>
