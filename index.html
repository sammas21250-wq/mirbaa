<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>مرباع MIRBAA 0.7</title><style>
*{box-sizing:border-box}body{margin:0;background:#080706;color:#f8f1df;font-family:Tahoma,Arial;overflow-x:hidden}
.app{max-width:520px;min-height:100vh;margin:auto;background:radial-gradient(circle at 50% 0,#3a2415,#100c08 42%,#070605);padding:10px}
header{height:64px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:31px;font-weight:800;color:#efc46d}.logo small{font-size:10px;letter-spacing:3px;color:#cdbb97}.score{display:flex;gap:5px;direction:ltr}.score div{background:#101b17;border:1px solid #ffffff17;border-radius:14px;padding:5px 12px;text-align:center}.score b{font-size:21px}.score span{display:block;font-size:10px;color:#c9c0ad}
.wood{height:calc(100svh - 84px);min-height:660px;padding:10px;border-radius:44px;background:linear-gradient(145deg,#8b572f,#3c2011 45%,#744326);box-shadow:0 18px 50px #000,inset 0 2px #f1b97a55}
.table{height:100%;position:relative;overflow:hidden;border:4px solid #332116;border-radius:36px;background:radial-gradient(ellipse at 50% 40%,#0b7452,#07523c 54%,#033426);box-shadow:inset 0 0 60px #001b13}
.table:before{content:"♠  مِرباع  ♣";position:absolute;top:42%;width:100%;text-align:center;font-size:38px;color:#ffffff06;transform:rotate(-8deg)}
.hud{position:absolute;z-index:10;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:11px}.chip{padding:8px 10px;border-radius:14px;background:#071b15dd;border:1px solid #ffffff12}
.seat{position:absolute;z-index:12;text-align:center;width:84px}.av{width:54px;height:54px;border-radius:50%;margin:auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#5b4432,#15100c 65%);border:3px solid #b98a4c;box-shadow:0 5px 15px #000b;font-weight:bold}.seat.on .av{border-color:#ffe09a;box-shadow:0 0 0 4px #ffc95a22,0 0 22px #ffc95a}.nm{font-size:13px;margin-top:3px}.sub{font-size:9px;color:#cbbfa9}.n{top:48px;left:50%;transform:translateX(-50%)}.e{right:-3px;top:40%;transform:translateY(-50%)}.w{left:-3px;top:40%;transform:translateY(-50%)}.s{bottom:3px;left:50%;transform:translateX(-50%)}
.backs{display:flex;direction:ltr;justify-content:center;margin-top:4px}.backs i{width:14px;height:31px;margin-left:-7px;border-radius:3px;border:1px solid #e2b963;background:repeating-linear-gradient(135deg,#7c171d 0 4px,#d8a44b 4px 7px)}
.center{position:absolute;z-index:14;left:50%;top:42%;transform:translate(-50%,-50%);width:64%;height:245px}.turn{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;padding:7px 11px;border-radius:13px;background:#061a14e8;font-size:11px}.up{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:65px;height:94px;border-radius:9px;background:#fffaf0;color:#111;display:grid;place-items:center;font:bold 23px Tahoma;box-shadow:0 7px 18px #0009}
.tc{position:absolute;width:57px;height:83px;border-radius:8px;background:#fffaf0;color:#111;display:grid;place-items:center;font:bold 18px Tahoma;box-shadow:0 6px 13px #0009}.red{color:#b51f2b!important}.p0{left:50%;bottom:0;transform:translateX(-50%)}.p1{right:0;top:50%;transform:translateY(-50%) rotate(-7deg)}.p2{left:50%;top:29px;transform:translateX(-50%)}.p3{left:0;top:50%;transform:translateY(-50%) rotate(7deg)}
.actions{position:absolute;z-index:20;left:50%;top:58%;transform:translateX(-50%);display:flex;gap:6px;direction:rtl}.actions button,.new{border:0;border-radius:14px;padding:12px 15px;background:#0b1b16;color:#fff;font:15px Tahoma;box-shadow:0 5px 13px #0008}.actions .gold{background:linear-gradient(#e8b85a,#b77a24);color:#171006}.actions .cream{background:#f5eddd;color:#17120d}
.hand{position:absolute;z-index:25;left:50%;bottom:67px;transform:translateX(-50%);width:98%;height:112px;display:flex;direction:ltr;justify-content:center;align-items:flex-end}.card{width:59px;height:94px;margin-left:-9px;border:1px solid #d6cab2;border-radius:9px;background:linear-gradient(145deg,#fffdf8,#eee5d3);color:#111;font:bold 19px Tahoma;box-shadow:0 6px 12px #0009;transition:.16s}.card.legal:active{transform:translateY(-15px);z-index:40}.card.illegal{opacity:.42;filter:grayscale(.4)}
.qaid{position:absolute;z-index:40;right:10px;bottom:11px;width:72px;height:55px;border:1px solid #ff777744;border-radius:18px;background:#bd1d26;color:white;font:16px Tahoma}.toast{position:absolute;z-index:40;left:10px;bottom:11px;max-width:225px;padding:8px 10px;border-radius:14px;background:#061914e8;border:1px solid #ffffff12;font-size:10px;line-height:1.5}
@media(max-width:390px){.card{width:54px;height:89px}.center{width:67%}}
</style></head><body><div class="app"><header><div class="logo">مِرباع <small>MIRBAA</small></div><div class="score"><div><span>لنا</span><b>0</b></div><div><span>لهم</span><b>0</b></div></div></header>
<main class="wood"><section class="table"><div class="hud"><span id="round">الصكة 1 • الأكلة 1/8</span><span class="chip" id="contract">السوق</span></div>
<div class="seat n" id="seat2"><div class="av">ن</div><div class="nm">ناصر</div><div class="sub">شريكك</div><div class="backs" id="b2"></div></div>
<div class="seat e" id="seat1"><div class="av">ف</div><div class="nm">فهد</div><div class="backs" id="b1"></div></div>
<div class="seat w" id="seat3"><div class="av">س</div><div class="nm">سالم</div><div class="backs" id="b3"></div></div>
<div class="center"><div class="turn" id="turntxt"></div><div class="up" id="up"></div><div id="trick"></div></div>
<div class="actions" id="actions"><button class="gold" onclick="buy('حكم')">حكم</button><button class="cream" onclick="buy('صن')">صن</button><button onclick="buy('بس')">بس</button></div>
<div class="hand" id="hand"></div><div class="seat s on" id="seat0"><div class="av">أنت</div><div class="nm">محمد</div><div class="sub">أنت</div></div>
<button class="qaid" onclick="toast('تم تسجيل طلب قيد')">⚠ قيد</button><div class="toast" id="toast">0.7 • محرك اتباع النوع مفعّل: إذا معك نفس نوع أول ورقة، لا يمكنك رمي غيره.</div>
</section></main></div>
<script>
const SUITS=['♠','♥','♦','♣'],RANKS=['7','8','9','10','J','Q','K','A'],N=['محمد','فهد','ناصر','سالم'];
let deck=[],hands=[[],[],[],[]],turn=0,phase='buy',market=null,contract='',trump=null,trick=[],trickNo=1;
function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function setup(){let id=0;deck=[];hands=[[],[],[],[]];for(let s of SUITS)for(let r of RANKS)deck.push({id:'c'+(++id),s,r});sh(deck);for(let n=0;n<5;n++)for(let p=0;p<4;p++)hands[p].push(deck.pop());market=deck.pop();render()}
const isred=c=>c.s==='♥'||c.s==='♦';
function legalCards(p){let h=hands[p];if(!trick.length)return h.slice();let lead=trick[0].c.s, same=h.filter(c=>c.s===lead);return same.length?same:h.slice()} // core fix: MUST follow led suit when held
function render(){
 for(let p=1;p<4;p++)document.getElementById('b'+p).innerHTML=hands[p].map(()=>'<i></i>').join('');
 let legal=new Set(legalCards(0).map(c=>c.id));
 document.getElementById('hand').innerHTML=hands[0].map(c=>`<button class="card ${isred(c)?'red':''} ${phase==='play'&&turn===0?(legal.has(c.id)?'legal':'illegal'):''}" onclick="human('${c.id}')">${c.s}<br>${c.r}</button>`).join('');
 document.getElementById('up').style.display=phase==='buy'?'grid':'none';document.getElementById('up').innerHTML=market?`<span class="${isred(market)?'red':''}">${market.s}<br>${market.r}</span>`:'';
 document.getElementById('actions').style.display=phase==='buy'&&turn===0?'flex':'none';
 document.getElementById('contract').textContent=phase==='buy'?'السوق':contract;document.getElementById('round').textContent=`الصكة 1 • الأكلة ${trickNo}/8`;
 document.getElementById('turntxt').textContent=phase==='buy'?`الشراء • دور ${N[turn]}`:`${contract} • دور ${N[turn]}`;
 for(let p=0;p<4;p++)document.getElementById('seat'+p).classList.toggle('on',p===turn);
 document.getElementById('trick').innerHTML=trick.map(x=>`<div class="tc p${x.p} ${isred(x.c)?'red':''}">${x.c.s}<br>${x.c.r}</div>`).join('')
}
function toast(t){document.getElementById('toast').textContent=t} function next(){turn=(turn+1)%4;render()}
function buy(x){if(phase!=='buy'||turn!==0)return;if(x==='بس'){toast('محمد: بس');next();return setTimeout(botBuy,420)}contract=x;trump=x==='حكم'?market.s:null;phase='play';hands[0].push(market);market=null;for(let p=0;p<4;p++)while(hands[p].length<8&&deck.length)hands[p].push(deck.pop());turn=0;toast(`تم الشراء: ${contract}${trump?' '+trump:''}`);render()}
function botBuy(){if(phase!=='buy'||turn===0)return;toast(N[turn]+': بس');next();if(turn!==0)setTimeout(botBuy,420)}
function human(id){if(phase!=='play'||turn!==0)return;let legal=legalCards(0);if(!legal.some(c=>c.id===id)){toast('لا يمكن: معك من نفس نوع أول ورقة');return}let i=hands[0].findIndex(c=>c.id===id),c=hands[0].splice(i,1)[0];trick.push({p:0,c});next();setTimeout(botPlay,400)}
function botPlay(){if(phase!=='play'||turn===0)return;let p=turn,legal=legalCards(p),c=legal[Math.floor(Math.random()*legal.length)],i=hands[p].findIndex(x=>x.id===c.id);hands[p].splice(i,1);trick.push({p,c});next();if(trick.length===4)setTimeout(resolve,650);else if(turn!==0)setTimeout(botPlay,400)}
function resolve(){/* winner hierarchy intentionally not claimed complete yet; 0.7 focuses on legal suit-following */trick=[];trickNo=Math.min(8,trickNo+1);turn=0;toast('انتهت الأكلة • اتباع النوع يعمل الآن');render()}
setup();
</script></body></html>
