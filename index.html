<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIRBAA — Alpha 0.3</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#080b09;color:#f8f1df;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
.app{min-height:100vh;background:radial-gradient(circle at 50% 25%,#234c38 0,#10271d 35%,#080b09 76%);padding:14px 12px 22px}
.top{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:auto}
.brand{display:flex;gap:9px;align-items:center}.logo{font-size:30px;color:#d9ad57;font-weight:800}.ver{font-size:12px;opacity:.7}
.score{display:flex;gap:8px}.pill{background:#ffffff0c;border:1px solid #ffffff1d;border-radius:18px;padding:8px 13px;text-align:center}.pill b{display:block;font-size:20px}
.tableWrap{max-width:760px;margin:12px auto 0;perspective:1000px}
.table{height:min(74vh,720px);min-height:570px;position:relative;border-radius:48%/18%;border:8px solid #573c24;box-shadow:0 18px 45px #000b,inset 0 0 0 3px #b7864833,inset 0 0 80px #0008;background:
radial-gradient(ellipse at center,#17633f 0,#0d4c30 46%,#07311f 100%);overflow:hidden}
.table:before{content:"";position:absolute;inset:10px;border:1px solid #ffffff14;border-radius:48%/18%;pointer-events:none}
.seat{position:absolute;text-align:center;z-index:4}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(#292c28,#10120f);border:3px solid #b68b50;box-shadow:0 5px 12px #0009;font-weight:800}.name{font-size:13px;margin-top:3px;text-shadow:0 2px 4px #000}.cardsCount{font-size:10px;opacity:.72}
.north{top:18px;left:50%;transform:translateX(-50%)}.south{bottom:12px;left:50%;transform:translateX(-50%)}.west{left:12px;top:47%;transform:translateY(-50%)}.east{right:12px;top:47%;transform:translateY(-50%)}
.opponentHand{display:flex;justify-content:center;margin-top:5px;direction:ltr}.back{width:22px;height:31px;margin-left:-12px;border-radius:4px;border:1px solid #e3c98d;background:repeating-linear-gradient(45deg,#7d1d1d 0 3px,#e2c77d 3px 5px);box-shadow:0 2px 4px #0008}
.center{position:absolute;z-index:5;left:50%;top:46%;transform:translate(-50%,-50%);width:66%;text-align:center}
.phase{display:inline-block;background:#07150fdd;border:1px solid #ffffff18;border-radius:18px;padding:8px 14px;font-size:13px;box-shadow:0 8px 20px #0006}
.buycard{width:64px;height:92px;margin:12px auto;background:#fff8e9;color:#161616;border-radius:9px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:25px;font-weight:800;box-shadow:0 10px 20px #0009;direction:ltr}
.red{color:#b5232a}.actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 17px;background:#f7efd9;color:#171b17;font-weight:800;font-size:15px;box-shadow:0 5px 10px #0005}.btn.gold{background:#d7aa52}.btn.dark{background:#0b1b13;color:#fff;border:1px solid #ffffff18}.btn:disabled{opacity:.35}
.trick{height:125px;position:relative;margin-top:8px}.played{position:absolute;width:58px;height:82px;border-radius:8px;background:#fff9ec;color:#111;display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:0 8px 15px #0008;direction:ltr}.p0{bottom:0;left:50%;transform:translateX(-50%)}.p1{left:8%;top:20px;transform:rotate(-8deg)}.p2{top:0;left:50%;transform:translateX(-50%)}.p3{right:8%;top:20px;transform:rotate(8deg)}
.hand{position:absolute;z-index:8;bottom:76px;left:50%;transform:translateX(-50%);width:92%;display:flex;justify-content:center;direction:ltr}.card{width:61px;height:92px;margin-left:-13px;border-radius:9px;border:1px solid #d8cba9;background:#fff9eb;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:19px;box-shadow:0 8px 14px #0008;transition:.18s;cursor:pointer}.card:hover,.card:active{transform:translateY(-12px)}.card.red{color:#b5232a}
.toast{max-width:760px;margin:10px auto;background:#ffffff0b;border:1px solid #ffffff16;border-radius:17px;padding:11px 14px;text-align:center;font-size:13px;min-height:42px;color:#ddd3bd}
.badge{position:absolute;top:12px;right:18px;background:#d6aa55;color:#15150f;padding:5px 9px;border-radius:12px;font-size:11px;font-weight:900}
.qaid{position:absolute;bottom:18px;right:18px;z-index:10;background:#a82323;color:white;border:0;border-radius:15px;padding:11px 15px;font-weight:900;box-shadow:0 7px 16px #0008}
@media(max-width:430px){.app{padding:9px 7px}.table{height:75vh;min-height:590px;border-width:6px}.center{width:72%}.card{width:53px;height:82px;font-size:17px;margin-left:-12px}.hand{bottom:70px}.logo{font-size:27px}}
</style>
</head>
<body><div class="app">
<div class="top">
 <div class="brand"><div class="logo">مِرباع</div><div><b>MIRBAA</b><div class="ver">Alpha 0.3 • Majlis UI</div></div></div>
 <div class="score"><div class="pill">لنا<b id="us">0</b></div><div class="pill">لهم<b id="them">0</b></div></div>
</div>
<div class="tableWrap"><div class="table">
<div class="badge" id="contract">الشراء</div>
<div class="seat north"><div class="avatar">ن</div><div class="name">ناصر</div><div class="cardsCount">شريكك</div><div class="opponentHand" id="hn"></div></div>
<div class="seat west"><div class="avatar">س</div><div class="name">سالم</div><div class="opponentHand" id="hw"></div></div>
<div class="seat east"><div class="avatar">ف</div><div class="name">فهد</div><div class="opponentHand" id="he"></div></div>
<div class="seat south"><div class="avatar">أنت</div><div class="name">محمد</div></div>

<div class="center">
 <div class="phase" id="phase">ورقة الشراء • اختر نوع اللعب</div>
 <div class="buycard" id="buy"></div>
 <div class="actions" id="actions"><button class="btn gold" onclick="choose('حكم')">حكم</button><button class="btn" onclick="choose('صن')">صن</button><button class="btn dark" onclick="choose('بس')">بس</button></div>
 <div class="trick" id="trick"></div>
</div>
<div class="hand" id="hand"></div>
<button class="qaid" onclick="qaid()">⚠ قيد!</button>
</div></div>
<div class="toast" id="toast">مجلس مِرباع — توزيع جديد بدأ. اختر شراءك.</div>
</div>
<script>
const suits=[['♠',0],['♥',1],['♦',1],['♣',0]], ranks=['7','8','9','10','J','Q','K','A'];
let deck=[],hands=[[],[],[],[]],buyCard,mode=null,turn=0,trick=[],us=0,them=0,playing=false;
function mkdeck(){deck=[];for(const [s,r] of suits)for(const v of ranks)deck.push({s,r,v,red:r});for(let i=deck.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function deal(){mkdeck();hands=[[],[],[],[]];for(let n=0;n<5;n++)for(let p=0;p<4;p++)hands[p].push(deck.pop());buyCard=deck.pop();render();setToast('تم توزيع 5 أوراق لكل لاعب وكشف ورقة الشراء.')}
function face(c,small=false){return `<span class="${c.red?'red':''}">${c.s}<br>${c.r}</span>`}
function render(){
 document.getElementById('buy').innerHTML=face(buyCard);
 document.getElementById('hand').innerHTML=hands[0].map((c,i)=>`<div class="card ${c.red?'red':''}" onclick="play(${i})">${c.s}<br>${c.r}</div>`).join('');
 [['hn',2],['hw',1],['he',3]].forEach(([id,p])=>document.getElementById(id).innerHTML=hands[p].map(()=>'<i class="back"></i>').join(''));
 document.getElementById('us').textContent=us;document.getElementById('them').textContent=them;
}
function choose(x){
 if(x==='بس'){setToast('قلت: بس. للتجربة انتقل الشراء لك مرة أخرى — اختر صن أو حكم.');return}
 mode=x;document.getElementById('contract').textContent=x+(x==='حكم'?' '+buyCard.s:'');
 document.getElementById('actions').style.display='none';document.getElementById('buy').style.display='none';
 for(let p=0;p<4;p++)while(hands[p].length<8)hands[p].push(deck.pop());
 playing=true;turn=0;document.getElementById('phase').textContent=`${x} • دورك في الأكلة الأولى`;render();setToast(`تم الشراء ${x}. اكتمل التوزيع إلى 8 أوراق. ارمِ ورقة.`);
}
function play(i){
 if(!playing||turn!==0)return;
 let c=hands[0].splice(i,1)[0];trick=[{p:0,c}];drawTrick();render();turn=1;setToast('رميت ورقتك… الخصوم يلعبون.');
 setTimeout(botChain,450)
}
function botChain(){
 if(turn>3){finishTrick();return}
 let p=turn, idx=Math.floor(Math.random()*hands[p].length),c=hands[p].splice(idx,1)[0];trick.push({p,c});turn++;drawTrick();render();setTimeout(botChain,350)
}
function drawTrick(){document.getElementById('trick').innerHTML=trick.map(x=>`<div class="played p${x.p}">${face(x.c)}</div>`).join('')}
function finishTrick(){
 let winner=trick[Math.floor(Math.random()*trick.length)].p; // UI alpha: full rules engine comes next
 if(winner%2===0)us+=2;else them+=2;
 setToast(`انتهت الأكلة — أخذها ${['أنت','سالم','ناصر','فهد'][winner]}.`);
 setTimeout(()=>{trick=[];drawTrick();turn=0;if(hands[0].length){document.getElementById('phase').textContent=`${mode} • الأكلة التالية`;render()}else endHand()},800)
}
function endHand(){playing=false;document.getElementById('phase').textContent='انتهت الصكة التجريبية';setToast('اكتملت 8 أكلات في واجهة Alpha 0.3. اضغط هنا لبدء صكة جديدة.');document.getElementById('toast').onclick=()=>location.reload()}
function qaid(){setToast('⚠️ تم طلب قيد — في النسخة القادمة يراجع Rule Engine آخر حركة بدل منع الخطأ مسبقًا.')}
function setToast(t){document.getElementById('toast').textContent=t}
deal();
</script></body></html>
