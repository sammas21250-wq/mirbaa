<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#080705"/>
<title>مرباع | MIRBAA</title>
<style>
:root{--gold:#e4b65c;--gold2:#f7d98e;--ink:#f9f3e5;--muted:#b9ad98;--green:#07523c;--panel:#0e100e;--red:#c7252f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#060504;color:var(--ink);font-family:Tahoma,Arial,sans-serif}
body{background:radial-gradient(circle at 50% -10%,#44301e 0,#120d09 35%,#050403 75%);overflow-x:hidden}
.app{width:min(100%,520px);min-height:100svh;margin:auto;position:relative;background:linear-gradient(#120d09aa,#080605dd)}
.topbar{height:72px;padding:calc(env(safe-area-inset-top) + 8px) 14px 7px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}.brandMark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#f0c76d,#9f651d);color:#171007;font-size:22px;box-shadow:0 5px 18px #0009}.brandText b{display:block;font-size:24px;color:var(--gold2);line-height:1}.brandText small{font-size:9px;letter-spacing:4px;color:#bcae91}
.topActions{display:flex;gap:7px}.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid #ffffff14;background:#11110f;color:#eadfc9;font-size:17px}
.gameShell{height:calc(100svh - 78px);min-height:690px;padding:8px 9px 12px}
.majlis{height:100%;position:relative;padding:11px;border-radius:42px;background:linear-gradient(145deg,#9a6033,#3a1f10 48%,#744222);box-shadow:0 18px 55px #000,inset 0 2px 1px #f4c48b55}
.rail{height:100%;padding:5px;border-radius:34px;background:linear-gradient(145deg,#29170e,#9c6034 50%,#28160d)}
.table{height:100%;position:relative;overflow:hidden;border-radius:29px;background:
radial-gradient(ellipse at 50% 43%,#0b7856 0,#07543e 53%,#03372a 100%);
box-shadow:inset 0 0 70px #001b13,inset 0 0 0 1px #ffffff0d}
.table:before{content:"";position:absolute;inset:0;opacity:.14;background-image:radial-gradient(#fff 0.55px,transparent .7px);background-size:5px 5px}
.watermark{position:absolute;top:43%;left:0;width:100%;text-align:center;color:#ffffff06;font-size:50px;font-weight:bold;transform:rotate(-9deg)}
.gameHud{position:absolute;z-index:20;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start}
.scoreboard{display:flex;direction:ltr;gap:5px}.scorebox{width:61px;padding:6px 4px;border-radius:14px;background:#071914e8;border:1px solid #ffffff12;text-align:center;box-shadow:0 5px 15px #0006}.scorebox small{display:block;font-size:10px;color:#c9bda8}.scorebox strong{font-size:21px}
.roundinfo{text-align:right;background:#071914e8;border:1px solid #ffffff12;border-radius:14px;padding:7px 10px;font-size:10px;line-height:1.55}
.roundinfo b{color:var(--gold2)}
.seat{position:absolute;z-index:16;width:86px;text-align:center;transition:.25s}.avatarWrap{position:relative;width:58px;height:58px;margin:auto}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#6a4d36,#1b130d 64%);border:3px solid #a97b42;box-shadow:0 7px 18px #000a;font-weight:bold;font-size:18px}.level{position:absolute;bottom:-2px;right:-2px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#111;border:1px solid var(--gold);font-size:9px}.seat.active .avatar{border-color:#ffe09b;box-shadow:0 0 0 4px #f1c35c20,0 0 25px #ffc95b88,0 7px 18px #000a}.name{font-size:12px;margin-top:4px;text-shadow:0 2px 3px #000}.tag{font-size:9px;color:#c4b7a0}.north{top:55px;left:50%;transform:translateX(-50%)}.east{right:-2px;top:39%;transform:translateY(-50%)}.west{left:-2px;top:39%;transform:translateY(-50%)}.south{bottom:2px;left:50%;transform:translateX(-50%)}
.cardbacks{display:flex;direction:ltr;justify-content:center;margin-top:5px}.cardbacks i{width:14px;height:31px;margin-left:-7px;border-radius:4px;border:1px solid #e7bb68;background:repeating-linear-gradient(135deg,#8b1e24 0 4px,#d5a048 4px 7px);box-shadow:0 2px 5px #0008}
.centerStage{position:absolute;z-index:15;left:50%;top:42%;transform:translate(-50%,-50%);width:64%;height:250px}
.turnPill{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;padding:7px 12px;border-radius:14px;background:#061813e8;border:1px solid #ffffff12;font-size:10px;box-shadow:0 5px 15px #0007}
.marketCard,.trickCard{background:linear-gradient(145deg,#fffef9,#eee4d0);color:#15110d;border:1px solid #d7c8aa;box-shadow:0 8px 18px #0009;font-weight:bold}.marketCard{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:66px;height:96px;border-radius:10px;display:grid;place-items:center;font-size:22px}
.trickCard{position:absolute;width:58px;height:84px;border-radius:9px;display:grid;place-items:center;font-size:18px;animation:deal .18s ease-out}.red{color:#ba2230!important}.p0{left:50%;bottom:0;transform:translateX(-50%)}.p1{right:0;top:50%;transform:translateY(-50%) rotate(-7deg)}.p2{left:50%;top:31px;transform:translateX(-50%)}.p3{left:0;top:50%;transform:translateY(-50%) rotate(7deg)}
@keyframes deal{from{opacity:.2;scale:.7}to{opacity:1;scale:1}}
.bidbar{position:absolute;z-index:25;left:50%;top:58%;transform:translateX(-50%);display:flex;gap:6px;direction:rtl}.bidbar button{min-width:68px;border:1px solid #ffffff10;border-radius:14px;padding:12px 11px;background:#0a1914;color:#fff;font:14px Tahoma;box-shadow:0 5px 14px #0008}.bidbar .gold{background:linear-gradient(#e7b75b,#b77824);color:#171006}.bidbar .cream{background:#f4ecdc;color:#18120d}
.hand{position:absolute;z-index:28;bottom:68px;left:50%;transform:translateX(-50%);width:98%;height:118px;display:flex;direction:ltr;justify-content:center;align-items:flex-end;pointer-events:none}
.card{pointer-events:auto;width:60px;height:96px;margin-left:-9px;border:1px solid #d7cab0;border-radius:10px;background:linear-gradient(145deg,#fffef9,#eee5d2);color:#17120e;box-shadow:0 7px 14px #0009;font:bold 19px Tahoma;transition:.17s}.card:nth-child(1){transform:rotate(-8deg) translateY(8px)}.card:nth-child(2){transform:rotate(-5deg) translateY(4px)}.card:nth-child(3){transform:rotate(-2deg)}.card:nth-child(6){transform:rotate(3deg)}.card:nth-child(7){transform:rotate(6deg) translateY(4px)}.card:nth-child(8){transform:rotate(9deg) translateY(8px)}.card:active{transform:translateY(-17px)!important;z-index:50}.card.disabled{opacity:.38;filter:grayscale(.5)}
.qaid{position:absolute;z-index:40;right:10px;bottom:10px;width:74px;height:55px;border:1px solid #ff888844;border-radius:18px;background:linear-gradient(#d02a33,#a8151d);color:white;font:15px Tahoma;box-shadow:0 7px 18px #0009}.infoToast{position:absolute;z-index:40;left:10px;bottom:10px;max-width:230px;min-height:40px;padding:8px 11px;border-radius:14px;background:#061713e8;border:1px solid #ffffff12;font-size:10px;line-height:1.5;box-shadow:0 5px 14px #0008}
.sheet{display:none;position:absolute;z-index:80;inset:0;background:#0009;align-items:flex-end}.sheet.show{display:flex}.sheetBox{width:100%;padding:18px 15px calc(18px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:linear-gradient(#171510,#090907);border-top:1px solid #ffffff18;box-shadow:0 -18px 45px #000}.sheetBox h2{margin:0 0 5px;color:var(--gold2)}.sheetBox p{margin:0 0 15px;color:#bfb49f;font-size:12px}.sheetGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheetGrid button{padding:13px;border-radius:13px;border:1px solid #ffffff12;background:#121714;color:#eee;font:13px Tahoma}.close{width:100%;margin-top:9px;padding:13px;border:0;border-radius:13px;background:linear-gradient(#e3b45b,#a86c20);font:bold 14px Tahoma;color:#171006}
@media(max-width:390px){.card{width:54px;height:91px}.centerStage{width:68%}.scorebox{width:55px}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brandMark">♠</div><div class="brandText"><b>مِرباع</b><small>MIRBAA</small></div></div><div class="topActions"><button class="iconbtn" onclick="toggleSheet()">☰</button><button class="iconbtn" onclick="toast('الصوت: مفعّل')">♪</button></div></header>
<main class="gameShell"><div class="majlis"><div class="rail"><section class="table">
<div class="watermark">مِرباع</div>
<div class="gameHud"><div class="scoreboard"><div class="scorebox"><small>لنا</small><strong id="us">0</strong></div><div class="scorebox"><small>لهم</small><strong id="them">0</strong></div></div><div class="roundinfo"><b id="contractText">السوق</b><br><span id="roundText">الصكة 1 • الأكلة 1/8</span></div></div>
<div class="seat north" id="seat2"><div class="avatarWrap"><div class="avatar">ن</div><span class="level">12</span></div><div class="name">ناصر</div><div class="tag">شريكك</div><div class="cardbacks" id="b2"></div></div>
<div class="seat east" id="seat1"><div class="avatarWrap"><div class="avatar">ف</div><span class="level">12</span></div><div class="name">فهد</div><div class="cardbacks" id="b1"></div></div>
<div class="seat west" id="seat3"><div class="avatarWrap"><div class="avatar">س</div><span class="level">11</span></div><div class="name">سالم</div><div class="cardbacks" id="b3"></div></div>
<div class="centerStage"><div class="turnPill" id="turnPill"></div><div class="marketCard" id="market"></div><div id="trick"></div></div>
<div class="bidbar" id="bidbar"><button class="gold" onclick="buy('حكم')">حكم</button><button class="cream" onclick="buy('صن')">صن</button><button onclick="buy('بس')">بس</button></div>
<div class="hand" id="hand"></div>
<div class="seat south active" id="seat0"><div class="avatarWrap"><div class="avatar">أنت</div><span class="level">13</span></div><div class="name">محمد</div><div class="tag">أنت</div></div>
<button class="qaid" onclick="toast('طلب قيد مسجل — التحكيم الكامل قادم مع محرك القواعد')">⚠ قيد</button><div class="infoToast" id="toast">واجهة MIRBAA الجديدة • تصميم تطبيق فعلي</div>
</section></div></div></main>
<div class="sheet" id="sheet"><div class="sheetBox"><h2>مِرباع</h2><p>جلسة البلوت الحالية</p><div class="sheetGrid"><button>الإعدادات</button><button>سجل الجولة</button><button>اللاعبون</button><button>مغادرة المجلس</button></div><button class="close" onclick="toggleSheet()">العودة للطاولة</button></div></div>
</div>
<script>
const S=['♠','♥','♦','♣'],R=['7','8','9','10','J','Q','K','A'],N=['محمد','فهد','ناصر','سالم'];
let D=[],H=[[],[],[],[]],turn=0,phase='buy',market=null,contract='',trump=null,trick=[],trickNo=1;
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function setup(){let id=0;D=[];H=[[],[],[],[]];for(const s of S)for(const r of R)D.push({id:'c'+(++id),s,r});shuffle(D);for(let n=0;n<5;n++)for(let p=0;p<4;p++)H[p].push(D.pop());market=D.pop();render()}
const red=c=>c.s==='♥'||c.s==='♦';
function legal(p){if(!trick.length)return H[p].slice();let lead=trick[0].c.s,same=H[p].filter(c=>c.s===lead);return same.length?same:H[p].slice()}
function backs(p){document.getElementById('b'+p).innerHTML=H[p].map(()=>'<i></i>').join('')}
function render(){
 [1,2,3].forEach(backs);let ok=new Set(legal(0).map(c=>c.id));
 hand.innerHTML=H[0].map(c=>`<button class="card ${red(c)?'red':''} ${phase==='play'&&turn===0&&!ok.has(c.id)?'disabled':''}" onclick="play('${c.id}')">${c.s}<br>${c.r}</button>`).join('');
 marketEl=document.getElementById('market');marketEl.style.display=phase==='buy'?'grid':'none';marketEl.innerHTML=market?`<span class="${red(market)?'red':''}">${market.s}<br>${market.r}</span>`:'';
 bidbar.style.display=phase==='buy'&&turn===0?'flex':'none';contractText.textContent=phase==='buy'?'السوق':contract+(trump?' '+trump:'');roundText.textContent=`الصكة 1 • الأكلة ${trickNo}/8`;
 turnPill.textContent=phase==='buy'?`الشراء • دور ${N[turn]}`:`${contract}${trump?' '+trump:''} • دور ${N[turn]}`;
 for(let p=0;p<4;p++)document.getElementById('seat'+p).classList.toggle('active',p===turn);
 document.getElementById('trick').innerHTML=trick.map(x=>`<div class="trickCard p${x.p} ${red(x.c)?'red':''}">${x.c.s}<br>${x.c.r}</div>`).join('')
}
function toast(t){document.getElementById('toast').textContent=t}function next(){turn=(turn+1)%4;render()}
function buy(x){if(phase!=='buy'||turn!==0)return;if(x==='بس'){toast('محمد قال: بس');next();return setTimeout(botBuy,420)}contract=x;trump=x==='حكم'?market.s:null;phase='play';H[0].push(market);market=null;for(let p=0;p<4;p++)while(H[p].length<8&&D.length)H[p].push(D.pop());turn=0;toast('تم الشراء • '+contract+(trump?' '+trump:''));render()}
function botBuy(){if(phase!=='buy'||turn===0)return;toast(N[turn]+' قال: بس');next();if(turn!==0)setTimeout(botBuy,420)}
function play(id){if(phase!=='play'||turn!==0)return;let allowed=legal(0);if(!allowed.some(c=>c.id===id)){toast('لا يمكن لعب هذه الورقة: معك من نفس النوع');return}let i=H[0].findIndex(c=>c.id===id),c=H[0].splice(i,1)[0];trick.push({p:0,c});next();setTimeout(botPlay,390)}
function botPlay(){if(phase!=='play'||turn===0)return;let p=turn,a=legal(p),c=a[Math.floor(Math.random()*a.length)],i=H[p].findIndex(x=>x.id===c.id);H[p].splice(i,1);trick.push({p,c});next();if(trick.length===4)setTimeout(()=>{trick=[];trickNo=Math.min(8,trickNo+1);turn=0;toast('واجهة الجولة جاهزة • محرك الفائز والنقاط سيُبنى منفصلًا');render()},650);else if(turn!==0)setTimeout(botPlay,390)}
function toggleSheet(){sheet.classList.toggle('show')}setup();
</script></body></html>
