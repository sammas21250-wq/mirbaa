<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MIRBAA 0.6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#392315,#090604 55%);color:#fff8e8;font-family:Tahoma,Arial}.app{max-width:760px;min-height:100vh;margin:auto;padding:8px}.top{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:32px;font-weight:bold;color:#efc873}.brand small{font-size:13px;color:#ddd;margin-right:8px}.score{display:flex;gap:7px;direction:ltr}.score b{background:#0d211a;border:1px solid #ffffff22;border-radius:18px;padding:7px 18px;text-align:center;font-size:25px}.score i{display:block;font-style:normal;font-size:12px}.wood{height:calc(100vh - 92px);min-height:650px;max-height:880px;padding:12px;border-radius:50px;background:linear-gradient(145deg,#89542f,#3a2013,#764426);box-shadow:0 20px 50px #000,inset 0 2px #d89a6455}.table{height:100%;position:relative;overflow:hidden;border:5px solid #173b2e;border-radius:40px;background:radial-gradient(ellipse at 50% 40%,#0a8158,#075c41 48%,#043c2d);box-shadow:inset 0 0 70px #001a12}.table:after{content:"مِرباع";position:absolute;top:40%;width:100%;text-align:center;font-size:76px;font-weight:bold;color:#ffffff08;transform:rotate(-10deg)}.hud{position:absolute;z-index:9;top:14px;left:15px;right:15px;display:flex;justify-content:space-between;font-size:13px}.pill{background:#061c15dd;border:1px solid #ffffff12;padding:9px 13px;border-radius:17px}.seat{position:absolute;z-index:12;text-align:center;min-width:88px}.av{width:61px;height:61px;margin:auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3d372d,#111);border:3px solid #bd8c4a;box-shadow:0 6px 18px #0009;font-weight:bold;font-size:22px}.seat.on .av{border-color:#ffe2a0;box-shadow:0 0 0 5px #f1b94e22,0 0 26px #ffc75f}.nm{margin-top:5px}.role{font-size:11px;opacity:.65}.n{top:58px;left:50%;transform:translateX(-50%)}.e{right:-3px;top:43%;transform:translateY(-50%)}.w{left:-3px;top:43%;transform:translateY(-50%)}.s{bottom:5px;left:50%;transform:translateX(-50%)}.backs{display:flex;justify-content:center;direction:ltr;margin-top:6px}.backs i{width:16px;height:36px;margin-left:-8px;border-radius:4px;border:1px solid #e7bd6d;background:repeating-linear-gradient(135deg,#811c21 0 5px,#dba64f 5px 8px)}.center{position:absolute;z-index:15;left:50%;top:43%;transform:translate(-50%,-50%);width:65%;height:250px}.msg{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;background:#061b14e8;border:1px solid #ffffff12;padding:9px 14px;border-radius:17px}.buy,.tc{background:#fffaf0;color:#111;border:1px solid #d8cbb1;box-shadow:0 8px 18px #0008;font-weight:bold}.buy{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:72px;height:105px;border-radius:11px;display:grid;place-items:center;font-size:26px}.red{color:#b61f2d!important}.actions{position:absolute;z-index:20;left:50%;top:59%;transform:translateX(-50%);display:flex;gap:8px}.actions button{min-width:70px;padding:13px;border:0;border-radius:15px;font:17px Tahoma;background:#091d16;color:white;box-shadow:0 5px 14px #0008}.actions .gold{background:linear-gradient(#e4b75e,#b87d28);color:#191006}.actions .light{background:#f5edde;color:#18120c}.hand{position:absolute;z-index:25;bottom:72px;left:50%;transform:translateX(-50%);width:96%;height:120px;display:flex;direction:ltr;justify-content:center;align-items:flex-end}.card{width:64px;height:101px;margin-left:-10px;border-radius:10px;border:1px solid #d5c8af;background:linear-gradient(145deg,#fffdf7,#eee4d1);color:#111;box-shadow:0 7px 13px #0008;font:bold 22px Tahoma;transition:.18s}.card:active{transform:translateY(-17px)!important;z-index:50}.card:nth-child(1){transform:rotate(-8deg) translateY(7px)}.card:nth-child(2){transform:rotate(-5deg) translateY(3px)}.card:nth-child(3){transform:rotate(-2deg)}.card:nth-child(6){transform:rotate(3deg)}.card:nth-child(7){transform:rotate(6deg) translateY(4px)}.card:nth-child(8){transform:rotate(9deg) translateY(8px)}.tc{position:absolute;width:62px;height:91px;border-radius:9px;display:grid;place-items:center;font-size:21px}.p0{left:50%;bottom:0;transform:translateX(-50%)}.p1{right:0;top:50%;transform:translateY(-50%) rotate(-8deg)}.p2{left:50%;top:32px;transform:translateX(-50%)}.p3{left:0;top:50%;transform:translateY(-50%) rotate(8deg)}.qaid{position:absolute;z-index:40;right:13px;bottom:14px;width:82px;height:62px;border:0;border-radius:20px;background:#c51f27;color:white;font:18px Tahoma;box-shadow:0 8px 20px #0008}.toast{position:absolute;z-index:40;left:13px;bottom:14px;max-width:215px;background:#061a14e8;border:1px solid #ffffff12;padding:10px 12px;border-radius:16px;font-size:12px}
</style></head><body><div class="app"><header class="top"><div class="brand">مِرباع <small>MIRBAA</small></div><div class="score"><b><i>لنا</i>0</b><b><i>لهم</i>0</b></div></header><main class="wood"><section class="table"><div class="hud"><span id="round">الصكة 1 • الأكلة 1/8</span><span class="pill" id="mode">مرحلة الشراء</span></div>
<div class="seat n" id="seat2"><div class="av">ن</div><div class="nm">ناصر</div><div class="role">شريكك</div><div class="backs" id="b2"></div></div><div class="seat e" id="seat1"><div class="av">ف</div><div class="nm">فهد</div><div class="backs" id="b1"></div></div><div class="seat w" id="seat3"><div class="av">س</div><div class="nm">سالم</div><div class="backs" id="b3"></div></div>
<div class="center"><div class="msg" id="msg"></div><div class="buy" id="buy"></div><div id="trick"></div></div><div class="actions" id="acts"><button class="gold" onclick="purchase('حكم')">حكم</button><button class="light" onclick="purchase('صن')">صن</button><button onclick="purchase('بس')">بس</button></div><div class="hand" id="hand"></div><div class="seat s on" id="seat0"><div class="av">أنت</div><div class="nm">محمد</div><div class="role">دورك</div></div><button class="qaid" onclick="note('تم تسجيل طلب قيد')">⚠ قيد</button><div class="toast" id="toast">Real Majlis 0.6 • الدور: أنت ← يمينك ← المقابل ← يسارك</div></section></main></div>
<script>
const S=['♠','♥','♦','♣'],R=['7','8','9','10','J','Q','K','A'],N=['محمد','فهد','ناصر','سالم'];let D=[],H=[[],[],[],[]],turn=0,phase='buy',up=null,trick=[],tn=1,contract='';
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function start(){let id=0;D=[];for(let s of S)for(let r of R)D.push({id:'card-'+(++id),s,r});shuffle(D);for(let n=0;n<5;n++)for(let p=0;p<4;p++)H[p].push(D.pop());up=D.pop();draw()}
function red(c){return c.s==='♥'||c.s==='♦'} function backs(p){document.getElementById('b'+p).innerHTML=H[p].map(x=>'<i></i>').join('')}
function draw(){document.getElementById('hand').innerHTML=H[0].map(c=>`<button class="card ${red(c)?'red':''}" onclick="play('${c.id}')">${c.s}<br>${c.r}</button>`).join('');[1,2,3].forEach(backs);document.getElementById('buy').style.display=phase==='buy'?'grid':'none';document.getElementById('buy').innerHTML=up?`<span class="${red(up)?'red':''}">${up.s}<br>${up.r}</span>`:'';document.getElementById('acts').style.display=phase==='buy'&&turn===0?'flex':'none';document.getElementById('msg').textContent=phase==='buy'?`ورقة الشراء • دور ${N[turn]}`:`${contract} • دور ${N[turn]}`;document.getElementById('mode').textContent=phase==='buy'?'مرحلة الشراء':contract;document.getElementById('round').textContent=`الصكة 1 • الأكلة ${tn}/8`;for(let p=0;p<4;p++)document.getElementById('seat'+p).classList.toggle('on',p===turn);document.getElementById('trick').innerHTML=trick.map(x=>`<div class="tc p${x.p} ${red(x.c)?'red':''}">${x.c.s}<br>${x.c.r}</div>`).join('')}
function next(){turn=(turn+1)%4;draw()} function note(t){document.getElementById('toast').textContent=t}
function purchase(x){if(phase!=='buy'||turn!==0)return;if(x==='بس'){note('محمد قال: بس');next();setTimeout(botBuy,450);return}contract=x+(x==='حكم'?' '+up.s:'');phase='play';H[0].push(up);up=null;for(let p=0;p<4;p++)while(H[p].length<8&&D.length)H[p].push(D.pop());turn=0;note('تم الشراء: '+contract);draw()}
function botBuy(){if(phase!=='buy'||turn===0)return;note(N[turn]+' قال: بس');next();if(turn!==0)setTimeout(botBuy,450)}
function play(id){if(phase!=='play'||turn!==0)return;let i=H[0].findIndex(c=>c.id===id);if(i<0)return;let exact=H[0].splice(i,1)[0];trick.push({p:0,c:exact});next();setTimeout(botPlay,420)}
function botPlay(){if(phase!=='play'||turn===0)return;let p=turn,c=H[p].shift();trick.push({p,c});next();if(trick.length===4)setTimeout(()=>{trick=[];tn=Math.min(8,tn+1);turn=0;note('انتهت الأكلة • دورك');draw()},650);else if(turn!==0)setTimeout(botPlay,420)}
start();
</script></body></html>
