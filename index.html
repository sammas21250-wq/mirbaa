<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIRBAA Alpha 0.2</title><style>
:root{--bg:#08110d;--felt:#0f4c32;--felt2:#123e2d;--gold:#d7ae58;--cream:#fff8e8;--muted:#b8c6be;--red:#b9252d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at 50% -10%,#274534,#08100c 58%);color:white;min-height:100vh}.app{max-width:820px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:950;font-size:28px;color:var(--gold)}.sub{font-size:11px;color:#dfe8e2}.scores{display:flex;gap:7px}.score{padding:8px 12px;border-radius:18px;background:#ffffff0c;border:1px solid #ffffff20;font-size:13px}.score b{font-size:20px}.table{position:relative;height:650px;margin-top:10px;border-radius:36px;background:radial-gradient(circle at center,#1b6a45,#10442e 56%,#0b2b1e);border:2px solid #ffffff20;box-shadow:inset 0 0 65px #0007,0 18px 45px #0006;overflow:hidden}.seat{position:absolute;text-align:center;font-size:12px;color:#e8efe9;z-index:3}.avatar{width:48px;height:48px;border-radius:50%;background:#0a1a12;border:2px solid #ffffff35;display:grid;place-items:center;margin:auto;font-weight:900}.north{top:12px;left:50%;transform:translateX(-50%)}.east{right:10px;top:44%}.west{left:10px;top:44%}.south{bottom:9px;left:50%;transform:translateX(-50%)}.badge{font-size:10px;background:#0007;padding:3px 7px;border-radius:10px;margin-top:3px;display:inline-block}.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:76%;text-align:center}.status{background:#07130dcc;border:1px solid #ffffff1c;padding:10px;border-radius:15px;font-size:13px}.upcard{display:none;margin:10px auto;width:58px;height:82px;border-radius:9px;background:var(--cream);color:#111;place-items:center;font-weight:900;font-size:20px;box-shadow:0 5px 14px #0007}.red{color:#b41e2b!important}.controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:9px 0}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:850;background:#f1e8d5;color:#152019}.btn.gold{background:var(--gold)}.btn.dark{background:#14251c;color:#fff;border:1px solid #ffffff20}.btn.qayd{background:#b3242b;color:#fff}.btn:disabled{opacity:.35}.trick{height:160px;position:relative}.played{position:absolute;width:58px;height:82px;border-radius:9px;background:var(--cream);color:#111;display:grid;place-items:center;font-weight:950;font-size:17px;box-shadow:0 5px 13px #0007}.p0{bottom:0;left:50%;transform:translateX(-50%)}.p1{right:7%;top:38px}.p2{top:0;left:50%;transform:translateX(-50%)}.p3{left:7%;top:38px}.hand{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);display:flex;direction:ltr;justify-content:center;width:94%;z-index:4}.card{width:55px;height:83px;margin-left:-9px;border-radius:9px;background:var(--cream);color:#111;border:1px solid #c7bdab;font-size:17px;font-weight:950;box-shadow:0 5px 12px #0007;transition:.14s}.card:not(:disabled):active{transform:translateY(-10px)}.card:disabled{opacity:.42}.panel{margin-top:10px;padding:11px;border:1px solid #ffffff16;background:#ffffff08;border-radius:15px;color:var(--muted);font-size:12px}.phase{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.chip{padding:5px 8px;border-radius:999px;background:#ffffff10;color:#dce7e0;font-size:10px}.projects{display:none}.projectBtn{font-size:12px}.footer{text-align:center;color:#6f8277;font-size:10px;margin:9px}.winner{color:var(--gold);font-weight:900}@media(max-width:520px){.table{height:650px}.center{width:78%}.card{width:50px;height:77px;font-size:15px}.hand{width:98%}.brand{font-size:25px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">مِرباع <span class="sub">MIRBAA</span></div><div class="sub">Alpha 0.2 • محرك صكة محلي</div></div><div class="scores"><div class="score">لنا <b id="us">0</b></div><div class="score">لهم <b id="them">0</b></div></div></header><section class="table"><div class="seat north"><div class="avatar">ن</div>ناصر<div class="badge" id="nCount">5 ورق</div></div><div class="seat east"><div class="avatar">ف</div>فهد<div class="badge" id="eCount">5 ورق</div></div><div class="seat west"><div class="avatar">س</div>سالم<div class="badge" id="wCount">5 ورق</div></div><div class="seat south"><div class="avatar">أنت</div></div><div class="center"><div class="phase"><span class="chip" id="phase">التوزيع</span><span class="chip" id="contract">—</span></div><div class="status" id="status">جاري توزيع الورق…</div><div class="upcard" id="upcard"></div><div class="controls" id="bidding"></div><div class="projects" id="projects"><div class="controls"><button class="btn dark projectBtn" onclick="declareProject('سرا')">سرا</button><button class="btn dark projectBtn" onclick="declareProject('خمسين')">خمسين</button><button class="btn dark projectBtn" onclick="declareProject('مية')">مية</button><button class="btn dark projectBtn" onclick="declareProject('400')">400</button><button class="btn" onclick="declareProject('بدون')">بدون مشروع</button></div></div><div class="trick" id="trick"></div><div class="controls"><button class="btn" id="new" onclick="newDeal()">صكة جديدة</button><button class="btn qayd" id="qayd" onclick="qayd()" disabled>⚠️ قيد!</button></div></div><div class="hand" id="hand"></div></section><section class="panel"><div id="log">نجهز الصكة…</div></section><div class="footer">MIRBAA • نسخة اختبار — لا أموال أو مراهنات حقيقية</div></main><script>
const suits=['♠','♥','♦','♣'],ranks=['7','8','9','J','Q','K','10','A'];const names=['أنت','فهد','ناصر','سالم'];let hands=[],stock=[],up=null,mode=null,trump=null,buyer=0,turn=0,leader=0,trick=[],tricksWon=[0,0],raw=[0,0],scores=[0,0],phase='deal',declared=null,qaydCase=null;const $=x=>document.getElementById(x);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeDeck(){let d=[];for(const s of suits)for(const r of ranks)d.push({s,r,id:s+r});return shuffle(d)}function red(c){return c.s==='♥'||c.s==='♦'}function chtml(c){return `${c.s}<br>${c.r}`}function setPhase(x){$('phase').textContent=x}function log(x){$('log').innerHTML=x}function counts(){['eCount','nCount','wCount'].forEach((id,i)=>$(id).textContent=(hands[i+1]?.length||0)+' ورق')}function newDeal(){let d=makeDeck();hands=[[],[],[],[]];stock=[];up=null;mode=null;trump=null;buyer=0;turn=0;leader=0;trick=[];tricksWon=[0,0];raw=[0,0];declared=null;qaydCase=null;phase='bid';$('new').disabled=true;$('qayd').disabled=true;$('trick').innerHTML='';$('projects').style.display='none';for(let p=0;p<4;p++){hands[p].push(...d.splice(0,3));hands[p].push(...d.splice(0,2))}up=d.shift();stock=d;$('upcard').style.display='grid';$('upcard').innerHTML=chtml(up);$('upcard').className='upcard'+(red(up)?' red':'');setPhase('الشراء');$('contract').textContent='ورقة: '+up.id;$('status').textContent='اختر شراءك';$('bidding').innerHTML=`<button class="btn gold" onclick="buy('hokum')">حكم ${up.s}</button><button class="btn" onclick="buy('sun')">صن</button><button class="btn dark" onclick="passBid()">بس</button>`;renderHand(true);counts();log('تم توزيع 5 أوراق لكل لاعب وكشف ورقة الشراء.');}
function passBid(){log('قلت بس. للتجربة سيشتري فهد حكم بعد لحظة.');$('bidding').innerHTML='';setTimeout(()=>finalizeBuy('hokum',1,up.s),650)}function buy(m){finalizeBuy(m,0,m==='hokum'?up.s:null)}function finalizeBuy(m,b,t){mode=m;buyer=b;trump=t;hands[b].push(up);hands[b].push(...stock.splice(0,2));for(let p=0;p<4;p++)if(p!==b)hands[p].push(...stock.splice(0,3));$('upcard').style.display='none';$('bidding').innerHTML='';$('contract').textContent=(mode==='sun'?'صن':'حكم '+trump)+' • المشتري '+names[buyer];setPhase('المشاريع');$('status').textContent='أعلن مشروعك إن وجد';$('projects').style.display='block';renderHand(false);counts();log('اكتمل التوزيع: 8 أوراق لكل لاعب. الآن إعلان المشاريع قبل اللعب.');}
const seqOrder=['7','8','9','10','J','Q','K','A'];function actualProjects(hand){let out=[];for(const s of suits){let idx=hand.filter(c=>c.s===s).map(c=>seqOrder.indexOf(c.r)).sort((a,b)=>a-b);let run=1,best=1;for(let i=1;i<idx.length;i++){if(idx[i]===idx[i-1]+1){run++;best=Math.max(best,run)}else run=1}if(best>=5)out.push('مية');else if(best===4)out.push('خمسين');else if(best===3)out.push('سرا')}for(const r of ['10','J','Q','K'])if(hand.filter(c=>c.r===r).length===4)out.push('مية');if(hand.filter(c=>c.r==='A').length===4)out.push(mode==='sun'?'400':'مية');return out}function declareProject(p){declared=p;$('projects').style.display='none';let actual=actualProjects(hands[0]);if(p!=='بدون'&&!actual.includes(p)){qaydCase={type:'wrong-project',declared:p,actual};$('qayd').disabled=false;log('أعلنت <b>'+p+'</b>. في وضع المجلس لم أمنع الإعلان؛ يوجد الآن موقف يمكن مراجعته بالقيد.')}else log(p==='بدون'?'لم تعلن مشروعًا.':'أعلنت مشروع '+p+'.');startPlay()}
function startPlay(){phase='play';setPhase('اللعب');turn=1;leader=1;$('status').textContent='فهد يبدأ الأكلة';renderHand(false);setTimeout(botPlay,550)}function plainStrength(r){return {'7':0,'8':1,'9':2,'J':3,'Q':4,'K':5,'10':6,'A':7}[r]}function trumpStrength(r){return {'7':0,'8':1,'Q':2,'K':3,'10':4,'A':5,'9':6,'J':7}[r]}function legalCards(p){if(!trick.length)return hands[p].slice();let lead=trick[0].card.s,follow=hands[p].filter(c=>c.s===lead);if(follow.length){if(mode==='hokum'&&lead===trump){let current=trick.filter(x=>x.card.s===trump).sort((a,b)=>trumpStrength(b.card.r)-trumpStrength(a.card.r))[0];let higher=follow.filter(c=>trumpStrength(c.r)>trumpStrength(current.card.r));if(higher.length)return higher}return follow}if(mode==='hokum'){let partner=(p+2)%4,win=currentWinner();if(win===partner)return hands[p].slice();let ts=hands[p].filter(c=>c.s===trump);if(ts.length){let tableTrumps=trick.filter(x=>x.card.s===trump);if(tableTrumps.length){let best=tableTrumps.sort((a,b)=>trumpStrength(b.card.r)-trumpStrength(a.card.r))[0];let higher=ts.filter(c=>trumpStrength(c.r)>trumpStrength(best.card.r));if(higher.length)return higher}return ts}}return hands[p].slice()}
function renderHand(pre){$('hand').innerHTML=hands[0].map((c,i)=>{let ok=pre||phase!=='play'||turn!==0?phase!=='play':legalCards(0).some(x=>x.id===c.id);return `<button class="card${red(c)?' red':''}" ${ok?'':'disabled'} onclick="human(${i})">${chtml(c)}</button>`}).join('')}function human(i){if(phase!=='play'||turn!==0)return;let c=hands[0][i];if(!legalCards(0).some(x=>x.id===c.id))return;hands[0].splice(i,1);play(0,c);renderHand(false)}function play(p,c){trick.push({p,card:c});renderTrick();counts();if(trick.length===4)return setTimeout(resolveTrick,650);turn=(p+1)%4;if(turn===0){$('status').textContent='دورك';renderHand(false)}else setTimeout(botPlay,420)}function botPlay(){if(phase!=='play'||turn===0)return;let p=turn,lc=legalCards(p),c=lc[Math.floor(Math.random()*lc.length)],i=hands[p].findIndex(x=>x.id===c.id);hands[p].splice(i,1);play(p,c)}function renderTrick(){$('trick').innerHTML=trick.map(x=>`<div class="played p${x.p}${red(x.card)?' red':''}">${chtml(x.card)}</div>`).join('')}function beats(a,b,lead){if(mode==='hokum'){if(a.s===trump&&b.s!==trump)return true;if(b.s===trump&&a.s!==trump)return false;if(a.s===b.s)return (a.s===trump?trumpStrength(a.r):plainStrength(a.r))>(b.s===trump?trumpStrength(b.r):plainStrength(b.r));return a.s===lead&&b.s!==lead}if(a.s===b.s)return plainStrength(a.r)>plainStrength(b.r);return a.s===lead&&b.s!==lead}function currentWinner(){if(!trick.length)return null;let lead=trick[0].card.s,b=trick[0];for(const x of trick.slice(1))if(beats(x.card,b.card,lead))b=x;return b.p}function cardPts(c){if(mode==='hokum'&&c.s===trump)return {'J':20,'9':14,'A':11,'10':10,'K':4,'Q':3,'8':0,'7':0}[c.r];return {'A':11,'10':10,'K':4,'Q':3,'J':2,'9':0,'8':0,'7':0}[c.r]}function resolveTrick(){let w=currentWinner(),team=w%2,pts=trick.reduce((s,x)=>s+cardPts(x.card),0);raw[team]+=pts;tricksWon[team]++;if(hands.every(h=>h.length===0))raw[team]+=10;log('الأكلة لـ <b>'+names[w]+'</b> • '+pts+' بنط');trick=[];$('trick').innerHTML='';leader=w;turn=w;if(hands.every(h=>h.length===0))return finishDeal();if(turn===0){$('status').textContent='الأكلة لك — ابدأ';renderHand(false)}else{$('status').textContent='دور '+names[turn];setTimeout(botPlay,450)}}function gamePoints(rawPts){if(mode==='sun')return Math.round(rawPts/5);return Math.round(rawPts/10)}function projectValue(p){if(p==='سرا')return mode==='sun'?4:2;if(p==='خمسين')return mode==='sun'?10:5;if(p==='مية')return mode==='sun'?20:10;if(p==='400')return mode==='sun'?40:0;return 0}function finishDeal(){phase='end';setPhase('الحساب');let gp=[gamePoints(raw[0]),gamePoints(raw[1])];if(declared&&declared!=='بدون'&&actualProjects(hands[0]).includes(declared))gp[0]+=projectValue(declared);let buyerTeam=buyer%2,other=1-buyerTeam;if(gp[buyerTeam]<=gp[other]){let total=(mode==='sun'?26:16);gp[other]=total+(declared&&declared!=='بدون'?projectValue(declared):0);gp[buyerTeam]=0}scores[0]+=gp[0];scores[1]+=gp[1];$('us').textContent=scores[0];$('them').textContent=scores[1];$('status').innerHTML=`انتهت الصكة — <span class="winner">لنا ${gp[0]} • لهم ${gp[1]}</span>`;$('new').disabled=false;renderHand(false);log(`الأبناط الخام: لنا ${raw[0]} / لهم ${raw[1]} • الأكلات: ${tricksWon[0]} / ${tricksWon[1]}. الحساب في Alpha 0.2 أقرب للبلوت لكنه ما زال يحتاج تدقيق حالات التقريب والدبل.`);if(scores[0]>=152||scores[1]>=152){setTimeout(()=>{alert((scores[0]>=152?'لنا':'لهم')+' فازوا بالمباراة!');scores=[0,0];$('us').textContent=0;$('them').textContent=0},300)}}function qayd(){if(!qaydCase)return log('لا توجد حالة قيد مسجلة حاليًا.');if(qaydCase.type==='wrong-project'){log(`✅ <b>قيد صحيح:</b> تم إعلان ${qaydCase.declared} بينما اليد لا تحتوي هذا المشروع وفق كاشف Alpha.`);$('qayd').disabled=true;qaydCase=null}}newDeal();
</script></body></html>
