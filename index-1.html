<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MIRBAA — Alpha 0.4</title>
<style>
:root{--gold:#d7ad62;--cream:#fff8e8;--felt:#075536;--felt2:#043d28;--wood:#6b4529}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#090b09;color:#fff7e6;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.app{min-height:100vh;padding:8px;background:
linear-gradient(#0008,#0008),
repeating-linear-gradient(90deg,#25170f 0 24px,#2c1c12 24px 48px)}
.hud{height:58px;max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 5px}
.brand{display:flex;align-items:center;gap:8px}.brandAr{font-size:28px;font-weight:900;color:var(--gold)}.sub{font-size:10px;opacity:.65}
.scores{display:flex;gap:6px}.score{min-width:58px;padding:5px 9px;border:1px solid #ffffff22;background:#111b15dd;border-radius:14px;text-align:center;font-size:11px}.score b{display:block;font-size:19px}
.board{max-width:760px;height:calc(100vh - 78px);min-height:610px;margin:auto;position:relative;overflow:hidden;border-radius:30px;
background:linear-gradient(150deg,#3c271a,#6a4427 18%,#392418 82%,#21150f);padding:12px;box-shadow:0 18px 45px #000}
.felt{height:100%;position:relative;overflow:hidden;border-radius:26px;border:3px solid #b88b4c88;background:
radial-gradient(ellipse at 50% 40%,#0c7449 0,#075838 42%,#033421 100%);
box-shadow:inset 0 0 60px #00180f,inset 0 0 0 8px #061d1588}
.felt:after{content:"MIRBAA";position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-10deg);font-weight:900;font-size:44px;letter-spacing:7px;color:#ffffff07}
.topline{position:absolute;z-index:12;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.contract{background:#081a12dd;border:1px solid #ffffff1b;border-radius:14px;padding:7px 10px;font-size:11px}.round{font-size:11px;opacity:.75}
.player{position:absolute;z-index:8;text-align:center}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(#272b27,#101310);border:2px solid var(--gold);box-shadow:0 5px 12px #0009;font-weight:900}.pname{font-size:12px;margin-top:2px;text-shadow:0 2px 3px #000}.partner{font-size:9px;opacity:.55}
.north{top:48px;left:50%;transform:translateX(-50%)}.west{left:10px;top:43%;transform:translateY(-50%)}.east{right:10px;top:43%;transform:translateY(-50%)}.south{bottom:8px;left:50%;transform:translateX(-50%)}
.minihand{display:flex;direction:ltr;justify-content:center;margin-top:3px}.back{width:20px;height:30px;margin-left:-10px;border:1px solid #e6c477;border-radius:4px;background:
linear-gradient(135deg,#7b171b 25%,#d5ad55 25% 35%,#7b171b 35% 60%,#d5ad55 60% 70%,#7b171b 70%);box-shadow:0 2px 4px #0008}
.center{position:absolute;z-index:6;left:50%;top:43%;transform:translate(-50%,-50%);width:70%;max-width:380px;text-align:center}
.message{display:inline-block;background:#071810e8;border:1px solid #ffffff17;padding:8px 13px;border-radius:15px;font-size:12px;box-shadow:0 7px 16px #0007}
.buy{width:66px;height:96px;margin:10px auto 8px;border-radius:9px;background:var(--cream);color:#151515;display:flex;align-items:center;justify-content:center;box-shadow:0 9px 18px #0009;border:1px solid #e5d6ad;font-size:22px;font-weight:900;direction:ltr}
.actions{display:flex;gap:6px;justify-content:center}.btn{border:0;border-radius:12px;padding:10px 15px;font-size:14px;font-weight:900;background:var(--cream);color:#151915;box-shadow:0 5px 10px #0006}.btn.gold{background:#d7aa53}.btn.dark{background:#071810;color:#fff;border:1px solid #ffffff18}
.trick{height:150px;position:relative}.played{position:absolute;width:57px;height:82px;border-radius:8px;background:var(--cream);color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;box-shadow:0 8px 16px #0009;direction:ltr;animation:drop .18s ease-out}.t0{bottom:0;left:50%;transform:translateX(-50%)}.t1{left:8%;top:34px;transform:rotate(-7deg)}.t2{top:0;left:50%;transform:translateX(-50%)}.t3{right:8%;top:34px;transform:rotate(7deg)}
@keyframes drop{from{opacity:0;scale:.75}to{opacity:1;scale:1}}
.hand{position:absolute;z-index:11;left:50%;bottom:68px;transform:translateX(-50%);width:94%;display:flex;justify-content:center;direction:ltr}
.card{width:58px;height:88px;margin-left:-12px;border-radius:9px;background:var(--cream);border:1px solid #ddcda6;color:#111;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 8px 15px #0009;transition:.15s;direction:ltr}.card:active{transform:translateY(-15px) scale(1.03)}
.red{color:#b51f28!important}
.qaid{position:absolute;z-index:15;right:12px;bottom:14px;border:0;border-radius:15px;background:#a71f24;color:#fff;padding:10px 13px;font-weight:900;box-shadow:0 7px 15px #0009}
.status{position:absolute;z-index:13;left:12px;bottom:15px;max-width:38%;font-size:10px;color:#dfd4bc;background:#06150fd9;border:1px solid #ffffff16;border-radius:12px;padding:7px 9px}
.dealAnim{animation:deal .28s ease-out}@keyframes deal{from{transform:translateY(-80px) scale(.5);opacity:0}to{transform:none;opacity:1}}
@media(max-width:390px){.board{border-radius:22px;padding:8px}.felt{border-radius:19px}.center{width:74%}.card{width:52px;height:80px;margin-left:-11px}.hand{bottom:63px}.avatar{width:44px;height:44px}.brandAr{font-size:25px}}
</style></head>
<body>
<div class="app">
<div class="hud"><div class="brand"><div class="brandAr">مِرباع</div><div><b>MIRBAA</b><div class="sub">Alpha 0.4 • مجلس</div></div></div><div class="scores"><div class="score">لنا<b id="us">0</b></div><div class="score">لهم<b id="them">0</b></div></div></div>
<div class="board"><div class="felt">
<div class="topline"><div class="contract" id="contract">مرحلة الشراء</div><div class="round" id="round">الصكة 1 • الأكلة 1/8</div></div>
<div class="player north"><div class="avatar">ن</div><div class="pname">ناصر</div><div class="partner">شريكك</div><div class="minihand" id="h2"></div></div>
<div class="player west"><div class="avatar">س</div><div class="pname">سالم</div><div class="minihand" id="h1"></div></div>
<div class="player east"><div class="avatar">ف</div><div class="pname">فهد</div><div class="minihand" id="h3"></div></div>
<div class="player south"><div class="avatar">أنت</div><div class="pname">محمد</div></div>
<div class="center"><div class="message" id="msg">ورقة الشراء • اختر نوع اللعب</div><div class="buy dealAnim" id="buy"></div><div class="actions" id="actions"><button class="btn gold" onclick="buyMode('حكم')">حكم</button><button class="btn" onclick="buyMode('صن')">صن</button><button class="btn dark" onclick="passBuy()">بس</button></div><div class="trick" id="trick"></div></div>
<div class="hand" id="hand"></div>
<div class="status" id="status">توزيع 5 أوراق وورقة شراء.</div>
<button class="qaid" onclick="qaid()">⚠ قيد</button>
</div></div></div>
<script>
const suits=[['♠',0],['♥',1],['♦',1],['♣',0]], ranks=['7','8','9','10','J','Q','K','A'];
let deck=[],hands=[[],[],[],[]],up=null,mode=null,trump=null,turn=0,trick=[],trickNo=1,us=0,them=0,playing=false,passes=0;
const $=id=>document.getElementById(id);
function shuffle(){deck=[];for(const [s,red] of suits)for(const r of ranks)deck.push({s,r,red});for(let i=31;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function newDeal(){shuffle();hands=[[],[],[],[]];for(let n=0;n<5;n++)for(let p=0;p<4;p++)hands[p].push(deck.pop());up=deck.pop();mode=null;trump=null;turn=0;trick=[];trickNo=1;playing=false;passes=0;render();status('توزيع 5 أوراق لكل لاعب وكشف ورقة الشراء.')}
function sym(c){return `<span class="${c.red?'red':''}">${c.s}<br>${c.r}</span>`}
function backs(p){return hands[p].map(()=>'<i class="back"></i>').join('')}
function render(){
 $('buy').innerHTML=sym(up);$('buy').style.display=playing?'none':'flex';
 $('hand').innerHTML=hands[0].map((c,i)=>`<div class="card ${c.red?'red':''}" onclick="play(${i})">${c.s}<br>${c.r}</div>`).join('');
 $('h1').innerHTML=backs(1);$('h2').innerHTML=backs(2);$('h3').innerHTML=backs(3);$('us').textContent=us;$('them').textContent=them;
 $('round').textContent=`الصكة 1 • الأكلة ${trickNo}/8`;
}
function passBuy(){passes++;status('قلت: بس. في Alpha 0.4 نعيد القرار لك لاختبار الواجهة.');}
function buyMode(x){mode=x;trump=x==='حكم'?up.s:null;$('contract').textContent=x+(trump?' '+trump:'');$('actions').style.display='none';for(let p=0;p<4;p++)while(hands[p].length<8)hands[p].push(deck.pop());playing=true;turn=0;$('msg').textContent=`${x} • دورك`;render();status('اكتمل التوزيع إلى 8 أوراق. اختر ورقة من يدك.')}
function play(i){if(!playing||turn!==0)return;let c=hands[0].splice(i,1)[0];trick=[{p:0,c}];turn=1;draw();render();status('تم رمي الورقة…');setTimeout(bot,360)}
function bot(){if(turn>3){finish();return}let p=turn,lead=trick[0].c.s,legal=hands[p].map((c,i)=>[c,i]).filter(x=>x[0].s===lead);let idx=(legal.length?legal[Math.floor(Math.random()*legal.length)][1]:Math.floor(Math.random()*hands[p].length));let c=hands[p].splice(idx,1)[0];trick.push({p,c});turn++;draw();render();setTimeout(bot,300)}
function draw(){$('trick').innerHTML=trick.map(x=>`<div class="played t${x.p}">${sym(x.c)}</div>`).join('')}
function val(c){const normal={A:8,'10':7,K:6,Q:5,J:4,'9':3,'8':2,'7':1},hok={J:9,'9':8,A:7,'10':6,K:5,Q:4,'8':2,'7':1};return (mode==='حكم'&&c.s===trump?hok:normal)[c.r]}
function winner(){let lead=trick[0].c.s,best=trick[0];for(const x of trick.slice(1)){let bc=best.c,c=x.c;if(mode==='حكم'&&c.s===trump&&bc.s!==trump)best=x;else if(c.s===bc.s&&val(c)>val(bc))best=x;else if(bc.s!==trump&&c.s===lead&&bc.s!==lead)best=x}return best.p}
function finish(){let w=winner();if(w%2===0)us+=2;else them+=2;status(`الأكلة لـ ${['محمد','سالم','ناصر','فهد'][w]}.`);setTimeout(()=>{trick=[];draw();trickNo++;turn=0;if(hands[0].length){$('msg').textContent=`${mode} • الأكلة ${trickNo}`;render()}else end()},650)}
function end(){playing=false;$('msg').textContent='انتهت الصكة';$('round').textContent='اكتملت 8 أكلات';status('اكتملت الصكة التجريبية. اضغط هنا لبدء توزيع جديد.');$('status').onclick=()=>location.reload()}
function qaid(){status('⚠ تم تسجيل طلب قيد. نظام مراجعة القيد الكامل سيُربط بمحرك القواعد لاحقًا.')}
function status(t){$('status').textContent=t}
newDeal();
</script>
</body></html>
